<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Authorization Required</title>
    <link rel="stylesheet" href="frontend/static/css/askLink.css">
    <link rel="shortcut icon" href="frontend/static/images/icon.png" type="image/x-icon" />
</head>
<body>
    
    <div class="container">
        <h2>Account Authorization</h2>
        <p class="description">You are attempting to access a protected resource. 
            Please confirm your action by signing in with <strong>{{.AuthType}}</strong></p>
        
        <form action="/askLink" method="post">
            <input type="hidden" name="accept" value="{{.UserID}}" required>
            <button type="submit" class="btn accept-btn">Authorize Access</button>
        </form>

        <form action="/logout" method="post">
            <button type="submit" class="btn cancel-btn">Decline and Logout</button>
        </form>
    </div>

</body>
</html>
